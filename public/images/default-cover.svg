<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="">
  <!--
    사진이 없는 글의 커버.

    124편 중 33편이 본문에도 사진이 없습니다. 목록에서 그 자리가 비면
    줄이 어긋나 보여서 이 그림으로 채웁니다.

    ⚠ 글자를 넣지 마세요. 시안 A 처럼 커버 위에 제목을 얹는 자리에서는
      그림 속 글자와 제목이 겹칩니다 (한 번 해 보고 뺐습니다).

    색은 limSystem 값입니다 — 배경 gray-990, 무늬 gray-980/950, 강조 teal-400.
    다크·라이트 양쪽에 같은 그림이 나가므로 어두운 쪽으로 맞췄습니다.
  -->
  <rect width="1200" height="900" fill="#181a1b"/>

  <!-- 지뢰찾기 판을 닮은 격자 -->
  <g fill="#1f2122">
    <rect x="0" y="150" width="150" height="150"/>
    <rect x="300" y="0" width="150" height="150"/>
    <rect x="750" y="300" width="150" height="150"/>
    <rect x="1050" y="600" width="150" height="150"/>
    <rect x="150" y="600" width="150" height="150"/>
    <rect x="600" y="750" width="150" height="150"/>
  </g>

  <g stroke="#242628" stroke-width="2">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200M0 750h1200"/>
    <path d="M150 0v900M300 0v900M450 0v900M600 0v900M750 0v900M900 0v900M1050 0v900"/>
  </g>

  <!-- 열린 칸 하나만 강조색으로 -->
  <rect x="450" y="450" width="150" height="150" fill="#58dddf" opacity="0.12"/>
  <rect x="451" y="451" width="148" height="148" fill="none" stroke="#58dddf" stroke-width="2" opacity="0.45"/>
</svg>
