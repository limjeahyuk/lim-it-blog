        overflow: visible !important;
      }

      /* ===============================================================
         5. 떠 있는 것들 — 메뉴 · 사진 고르는 창
         =============================================================== */

      [class*='DropdownList'],
      [class*='-menu'] {
        background-color: var(--a-card) !important;
        border: 1px solid var(--a-border) !important;
        border-radius: 12px !important;
        overflow: hidden !important;
        color: var(--a-text) !important;
      }

      [class*='StyledMenuItem'],
      [class*='-option'] {
        background-color: transparent !important;
        color: var(--a-text) !important;
      }

      [class*='StyledMenuItem']:hover,
      [class*='-option']:hover,
      [class*='-option'][class*='focused'] {
        background-color: var(--a-surface) !important;
      }

      [class*='-singleValue'],
      [class*='-input'] input {
        color: var(--a-text) !important;
      }
      [class*='-placeholder'] {
        color: var(--a-faint) !important;
      }

      /*
        미디어 라이브러리 — 툴바의 "사진" 이 여는 창입니다.
        Decap 기본값이 920px 고정폭이라 폰에서는 화면 밖으로 나갑니다.
      */
      [class*='StyledModal'] {
        background-color: var(--a-card) !important;
        color: var(--a-text) !important;
        border: 1px solid var(--a-border) !important;
        border-radius: 16px !important;
        max-width: calc(100vw - 24px) !important;
        max-height: calc(100vh - 48px) !important;
      }

      [class*='LibraryTitle'],
      [class*='CardText'] {
        color: var(--a-text) !important;
      }

      [class*='CardGridContainer'] {
        overflow-y: auto !important;
      }

      /* ===============================================================
         6. 좁은 화면

         Decap 은 데스크톱 기준으로 만들어져 있어서 주요 컨테이너에
         min-width: 800px 이 박혀 있습니다. 폰에서 열면 화면 밖으로 넘쳐
         오른쪽이 잘립니다.

         클래스 이름은 emotion 이 만든 것이라 해시가 붙지만
         (css-1fehwpo-AppMainContainer) 뒤의 컴포넌트 이름은 유지되므로
         부분 일치로 잡습니다. Decap 을 올릴 때 이름이 바뀌면 여기도
         확인이 필요합니다.
         =============================================================== */

      /*
        ⚠ 아래 두 규칙은 **editor.js 가 안 불러와졌을 때만** 쓰입니다.
          지금은 본문 위젯을 갈아끼워서 Decap 의 raw 편집기(.cms-editor-raw)가
          화면에 아예 안 나옵니다. 그래도 남겨 둡니다 — editor.js 가 죽으면
          Decap 기본 편집기로 떨어지는데, 그때 이 규칙이 없으면 죽어 있는
          툴바가 도로 나오고 편집기가 위 필드를 덮습니다.
      */
      .cms-editor-raw [class*='EditorControlBar'] {
        display: none !important;
      }
      .cms-editor-raw [contenteditable='true'] {
        margin-top: 0 !important;
      }

      /* 좁아지면 가운데 폭 제한을 풉니다 */
      @media (max-width: 940px) {
        .lim-form {
          max-width: none;
        }
        .lim-main {
          width: 100%;
        }
      }

      /* 목록 표는 좁아지면 제목과 날짜만 남깁니다 —
         네 칸을 다 욱여넣으면 제목이 두세 글자만 보입니다. */
      @media (max-width: 700px) {
        .lim-thead,
        .lim-cells {
          /* 날짜(2026-08-25)가 한 줄에 들어가는 최소 폭입니다 —
             더 좁히면 연도와 일자가 두 줄로 접힙니다 */
          grid-template-columns: minmax(0, 1fr) 74px;
          gap: 8px;
        }
        .lim-thead span:nth-child(2),
        .lim-cells span:nth-child(2),
        .lim-thead span:nth-child(4),
        .lim-cells span:nth-child(4) {
          display: none;
        }
        .lim-cells span:nth-child(1) {
          font-size: 14px;
        }
        .lim-cells span:nth-child(3) {
          font-size: 12px;
          text-align: right;
        }
        .lim-thead span:nth-child(3) {
          text-align: right;
        }
      }

      @media (max-width: 799px) {
        [class*='AppHeaderContent'],
        [class*='AppMainContainer'],
        [class*='EditorContainer'],
        [class*='ToolbarContainer'] {
          min-width: 0 !important;
          width: 100% !important;
        }

        /* ⚠ 머리띠에 자리가 없습니다. 다 적으면 오른쪽 끝이 44px 밀려서
           「게시」와 아바타가 화면 밖으로 나갑니다 (재서 확인). 숫자만
           남깁니다 — 읽어 주는 이름(aria-label)에는 그대로 다 있습니다. */
        .lim-drafts-label {
          display: none;
        }
        .lim-drafts-btn {
          padding: 6px 8px !important;
        }

        /*
          폰에서는 머리글 한 줄에 이름·메뉴 둘·해달·새 글·아바타가 다
          들어가야 합니다. 데스크톱 간격 그대로 두면 375px 에서 25px 이
          넘쳐서 아바타(로그아웃 자리)가 화면 밖으로 잘립니다.
        */
        [class*='AppHeaderContent'] {
          gap: 6px !important;
          padding: 0 10px !important;
        }
        [class*='AppHeaderActions'] {
          gap: 6px !important;
        }
        [class*='AppHeaderNavLink'],
        [class*='AppHeaderButton'] {
          padding: 7px 6px !important;
        }

        /*
          ⚠ **탭 줄을 두 번째 줄로 내립니다.**

          탭이 넷이 되면서(글·에디터·미디어·조회수 — 2026-09-09) 375px 에서는
          한 줄에 못 들어갑니다. 재 보면 이름·탭·해달·새 글·아바타가 390px 이라
          아바타가 15px 잘리고, 「쓰다 만 글」이 뜨면 30px 이 더 밀립니다.
          글자를 줄이고 여백을 걷어 봐도 402px 이라 계산이 안 맞습니다.

          그래서 접습니다 — 첫 줄은 이름과 오른쪽 단추들, 둘째 줄이 탭입니다.
          탭을 옆으로 흘려서 감추는 쪽(가로 스크롤)과 견줬는데, 넷 중 둘이
          화면 밖에 있으면 있는 줄도 모릅니다.

          ⚠ **둘째 줄 높이를 못박아 둡니다 (40px).** 조회수 지면(.lim-dash)이
            머리띠 아래에 붙는데, 그 값이 `top: 100px` 으로 여기 높이에
            기대고 있습니다 — 한쪽만 고치면 지면 위가 잘리거나 뜹니다.
        */
        [class*='AppHeaderContent'] {
          flex-wrap: wrap !important;
        }
        [class*='AppHeaderContent'] > nav {
          order: 3 !important;
          width: 100% !important;
          min-height: 40px !important;
        }
        [class*='AppHeaderNavList'] {
          gap: 2px !important;
          margin-left: -5px !important; /* 첫 탭을 이름과 세로로 맞춥니다 */
        }
        .lim-views-tab,
        .lim-ctab {
          padding: 7px 8px !important;
        }
        [class*='QuickNewButton'] {
          padding: 8px 14px !important;
        }
        [class*='AvatarDropdownButton'],
        [class*='AvatarDropdownButton'] > span,
        [class*='AvatarDropdownButton'] svg {
          width: 30px !important;
          height: 30px !important;
        }
        .lim-theme {
          width: 30px;
          height: 30px;
        }
        .lim-brand b {
          font-size: 14px;
        }
        .lim-brand i,
        .lim-brand span {
          display: none; /* "| Admin" 은 폰에서 자리만 먹습니다 */
        }
        .lim-brand {
          /* 탭이 아래로 내려가면서 이름이 첫 줄을 혼자 씁니다 */
          margin-right: auto;
        }

        [class*='ToolbarSectionMain'],
        [class*='ToolbarSectionBackLink'] {
          min-width: 0 !important;
        }

        [class*='CollectionContainer'],
        [class*='ControlPaneContainer'] {
          padding-left: 12px !important;
          padding-right: 12px !important;
        }

        /* ⚠ 위 규칙은 안쪽 판을 못 이깁니다 (`:not()` 이 붙어 특이도가
             높습니다). 바깥 판이 여백을 0 으로 두고 있으니 여기서 두 번
             나눠 주던 값(12 + 12)을 한 번에 줍니다. */
        [class*='ControlPaneContainer']:not([class*='PreviewPaneContainer']) {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }

        /* 아이폰 노치·홈바 영역 확보 */
        [class*='EditorContainer'] {
          padding-bottom: env(safe-area-inset-bottom) !important;
        }

        /* ── 1. 사파리가 입력칸을 확대하지 않게 ───────────────────────
           iOS 사파리는 글자가 16px 미만인 입력칸을 탭하면 화면을 당깁니다.
           Decap 기본값이 15px 이라, 필드를 하나 건드릴 때마다 확대됐다가
           손으로 다시 줄여야 했습니다. 딱 1px 이 원인입니다. */
        input,
        textarea,
        select,
        [class*='ControlPaneContainer'] [contenteditable='true'] {
          font-size: 16px !important;
        }

        /* ── 2. 목록 머리 ───────────────────────────────────────────
           제목 줄 오른쪽에 찾기 칸까지 놓을 폭이 없습니다 — 두 칸 격자를
           풀고 찾기·정렬을 제목 아래로 내립니다.

           ⚠ 폰에서 컬렉션을 고르는 길은 이제 **머리띠 탭**입니다
             (2026-09-09 시안). 예전에는 사이드바를 알약 둘로 눕혀 놨는데,
             컬렉션이 머리띠로 올라가면서 그 알약이 같은 것을 두 번
             보여 주게 됐습니다. */
        [class*='CollectionMain'] {
          display: block !important;
          padding-left: 0 !important;
        }
        [class*='CollectionControlsContainer'] {
          margin-top: 12px !important;
        }
        .lim-find {
          flex: 1 1 auto;
        }
        [class*='CollectionTopHeading'] {
          font-size: 24px !important;
        }
        .lim-thead,
        .lim-cells {
          padding-left: 12px !important;
          padding-right: 12px !important;
        }

        /* 에디터 — 카드는 한 줄에 하나, 줄에서는 「글 N편」을 뺍니다
           (끌개·얼굴·이름·펼치기·✕ 까지 놓으면 이름이 두세 글자만 보입니다) */
        .lim-eds {
          grid-template-columns: 1fr;
        }
        html[data-lim-collection='editors'] .lim-erow ~ .lim-ecount {
          display: none;
        }
        html[data-lim-collection='editors'] .lim-erow {
          margin-right: auto;
        }
        .lim-epanel {
          padding: 0 12px 12px !important;
        }
        .lim-egrid {
          grid-template-columns: minmax(0, 1fr);
        }

        /* ── 3. 폼을 짧게 ────────────────────────────────────────────
           필드 간격이 넓으면 열 개 늘어놓았을 때 스크롤이 한참입니다. */
        [class*='ControlContainer'] {
          margin-top: 16px !important;
        }
        .lim-modal-card {
          padding: 18px;
        }
        .lim-pill {
          padding: 8px 15px;
          font-size: 13px;
        }

        /*
          위 띠는 한 줄뿐입니다 (Decap 이 높이를 66px 로 못박아 두고
          position: absolute 로 띄웁니다 — 두 줄로 만들면 아래 폼을 덮습니다).
          그래서 폰에서는 상태 알약을 뺍니다. 왼쪽 "변경사항 저장됨" 이
          같은 자리에 있고, 초안 여부는 바로 아래 토글에서 보입니다.
        */
        .lim-status {
          display: none;
        }
        [class*='DeleteButton'],
        [class*='ToolbarSectionMain'] [class*='StyledDropdownButton'] {
          padding: 8px 14px !important;
        }

        /* ── 4. 상단 메뉴·날짜 버튼 글자가 반으로 접히던 것 ───────────
           "콘텐 츠""미디 어""현재시 각" 처럼 두 줄로 꺾여서 읽히지
           않았습니다. */
        [class*='AppHeader'] a,
        [class*='AppHeader'] button,
        [class*='DateControl'] button,
        [class*='ControlContainer'] button {
          white-space: nowrap !important;
        }

        /* ── 5. 드롭다운이 화면을 덮던 것 ────────────────────────────
           항목 하나가 78px 이라, 열면 300px 짜리 메뉴가 아래를 통째로
           가렸습니다. 키보드까지 올라오면 화면이 덮입니다. */
        [class*='-menu'] {
          max-height: min(40vh, 264px) !important;
        }
        [class*='-menu'] > div {
          max-height: min(40vh, 264px) !important;
        }
        [class*='-option'] {
          padding-top: 10px !important;
          padding-bottom: 10px !important;
          line-height: 1.4 !important;
        }

        /* ── 6. 사진 고르는 창이 화면 밖으로 나가던 것 ────────────────
           920×576 이 박혀 있어서 폰에서는 오른쪽이 잘리고, 아래쪽 버튼도
           안 보였습니다. */
        [class*='StyledModal'] {
          width: calc(100vw - 16px) !important;
          height: calc(100vh - 32px) !important;
          min-width: 0 !important;
        }
        /* 창 안쪽 줄들이 400px 로 박혀 있어서, 창만 줄이면 내용이 넘칩니다.
           검색창·"업로드" 버튼이 오른쪽으로 잘려 나갔습니다. */
        [class*='LibraryTop'],
        [class*='RowContainer'],
        [class*='SearchContainer'],
        [class*='ButtonsContainer'] {
          width: auto !important;
          min-width: 0 !important;
          max-width: 100% !important;
          flex-wrap: wrap !important;
          gap: 8px !important;
        }

        /* "저장" 메뉴는 버튼 왼쪽에 붙어서 열리는데 폭이 176px 이라
           오른쪽 끝 버튼에서 열면 화면 밖으로 나가 잘렸습니다. */
        [class*='DropdownList'] {
          left: auto !important;
          right: 0 !important;
          max-width: calc(100vw - 16px) !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      /*
        목록을 최신 글부터 보여줍니다.

        Decap 3.9 는 config.yml 에서 기본 정렬을 못 정합니다 — sortable_fields
        에 default 를 넣으면 "must be an array"로 설정이 통째로 안 읽힙니다.
        대신 Decap 이 정렬 상태를 담아두는 localStorage 키를 처음 한 번만
        채워 둡니다. 목록에서 정렬을 바꾸면 Decap 이 이 값을 덮어쓰고,
        그다음부터 여기는 손대지 않습니다.
      */
      ;(function () {
        var KEY = 'decap-cms.entries.sort'
        if (localStorage.getItem(KEY)) return
        localStorage.setItem(
          KEY,
          JSON.stringify({
            posts: {
              pubDate: { key: 'pubDate', direction: 'Descending', index: 0 },
            },
          })
        )
      })()
    </script>
    <script src="https://unpkg.com/decap-cms@3.9.0/dist/decap-cms.js"></script>
    <!--
      본문 편집기를 갈아끼우고 화면을 시안 모양으로 고칩니다. Decap 이 먼저
      떠 있어야 window.CMS 가 생기므로 순서를 바꾸지 마세요. ?v= 는
      config.yml 과 같은 이유로 캐시 무효화용입니다 — 고쳤는데 폰에서 안
      바뀌면 숫자를 올리세요.
    -->
    <script src="/admin/editor.js?v=26"></script>
  </body>
