backend:
  name: github
  repo: limjeahyuk/lim-it-blog
  branch: main
  # /api/auth 는 이 저장소의 Vercel 서버리스 함수입니다 (api/auth.js, api/callback.js)
  base_url: https://lim-it.vercel.app
  auth_endpoint: api/auth

# 로컬에서 `npm run cms` 를 띄우면 GitHub 없이 테스트할 수 있습니다.
local_backend: true

publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

# 사진은 저장소가 아니라 Cloudinary 로 올라갑니다 (2026-09-07).
#
# 왜: GitHub 백엔드는 사진 한 장을 base64 커밋으로 올립니다. 폰 원본이
#     3~5MB 라 폰에서 느리고, 올린 만큼 .git 이 계속 불어납니다
#     (public/images 54MB · .git 68MB). Cloudinary 는 올린 자리에서 바로
#     CDN 주소를 돌려줍니다.
#
# ⚠ <script> 를 더 걸지 마세요. decap-cms 3.9 번들에 이미 들어 있습니다
#   (번들에서 registerMediaLibrary(cloudinary) 를 확인했습니다). 위젯 본체만
#   열 때 media-library.cloudinary.com 에서 받아옵니다.
#
# ⚠ cloud_name·api_key 는 브라우저에 나가는 값이라 공개돼도 됩니다 —
#   올리려면 Cloudinary 로그인이 따로 필요합니다. **api_secret 은 절대
#   여기 적지 마세요.** 저장소가 공개이고 이 파일은 그대로 배포됩니다.
#
# ⚠ 이걸 켜면 저장소 안의 사진 429장은 고르는 창에 안 나옵니다. 이미 본문에
#   박혀 있는 주소라 화면에는 그대로 뜨고, 다시 골라 넣을 수만 없습니다.
#
# 돌려받는 주소는 전체 https 주소입니다 (번들에서 확인한 기본값 —
# use_secure_url: true · use_transformations: true · output_filename_only: false).
# 그 주소를 커버로도 쓰려고 src/lib/cover.ts 에 이 호스트를 뚫어 뒀습니다.
media_library:
  name: cloudinary
  config:
    # TODO Cloudinary → Settings → Product environment 에서 그대로 옮겨 적으세요.
    #      api_key 는 숫자만 있어서 따옴표를 빼면 YAML 이 숫자로 읽습니다.
    cloud_name: m1zcmsux
    api_key: "895653536158845"
    # 편집기에 사진을 **떨어뜨리거나 붙여넣을 때**만 쓰는 값입니다
    # (admin-src/upload.js). 「사진」 단추는 이것 없이도 돕니다 — 그쪽은
    # Cloudinary 창에서 로그인해서 올리니까요.
    #
    # 만드는 곳: Cloudinary → Settings → Upload → Upload presets →
    #            Add upload preset → Signing Mode 를 **Unsigned** 로.
    #
    # ⚠ 이 이름은 공개됩니다. 저장소가 공개이고 이 파일은 그대로 배포돼서,
    #   남이 이 프리셋으로 올릴 수 있습니다. **막는 자리는 코드가 아니라
    #   프리셋 설정입니다** — 폴더를 고정하고(예: blog), 최대 용량과 허용
    #   형식(image 만)을 좁혀 두세요. api_secret 은 여기에 절대 적지 않습니다
    #   (unsigned 는 secret 없이 올라갑니다).
    upload_preset: lim-it-blog
    # 폰 원본(3~5MB)을 그대로 본문에 걸지 않습니다. 긴 변 1600px 로 줄이고
    # (crop: limit — 작은 사진은 안 늘립니다) 화질·형식은 브라우저에 맞춰
    # 자동으로 고릅니다. 여기서 나온 주소가 본문에 들어갑니다.
    default_transformations:
      - - width: 1600
          crop: limit
          quality: auto
          fetch_format: auto
    multiple: false

locale: ko

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: src/content/posts
    create: true
    # 파일명 = URL 입니다. 제목을 그대로 쓰면 한글 주소가 나오므로
    # 영문 slug 를 직접 받습니다 (아래 slug 필드).
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    editor:
      preview: false
    # 목록 한 줄에 들어가는 글자입니다. Decap 은 이걸 **한 덩어리**로 그리는데,
    # admin/editor.js 가 ` · ` 로 갈라서 시안의 네 칸(제목·작성자·날짜·상태)에
    # 나눠 담습니다.
    # ⚠ 구분자를 바꾸면 admin-src/skin.js 의 SEP 도 같이 바꿔야 합니다.
    # ⚠ 순서를 바꾸면 칸이 뒤섞입니다.
    # editor.js 가 안 뜨면 이 글자가 그대로 한 줄로 보입니다 — 그래서
    # 알아볼 수 있는 구분자를 씁니다 (제목 128개에 ` · ` 는 없습니다).
    summary: "{{title}} · {{author}} · {{pubDate | date('YYYY-MM-DD')}} · {{draft}}"
    # Decap 3.9 는 배열만 받습니다 (기본 정렬 지정은 안 됩니다 — 넣으면 설정이 통째로 깨집니다).
    sortable_fields: ["pubDate", "title"]

    # ⚠ 지금은 안 쓰입니다. 위의 media_library(Cloudinary)가 켜져 있는 동안
    #   사진은 저장소를 안 거칩니다. Cloudinary 를 걷어내면 이 두 줄이
    #   그대로 되살아납니다 — 그래서 지우지 않고 둡니다.
    #
    # 사진은 글마다 제 폴더로 들어갑니다 — public/images/<주소>/.
    # 티스토리에서 옮겨온 404장이 쓰고 있는 규칙과 같은 자리입니다.
    # 앞의 / 는 "저장소 뿌리 기준"이라는 뜻입니다. 빼면 이 컬렉션 폴더
    # (src/content/posts) 밑으로 들어갑니다.
    media_folder: "/public/images/{{fields.slug}}"
    public_folder: "/images/{{fields.slug}}"

    # 이 순서가 폰에서 보이는 순서입니다 — 시안 차례입니다.
    #   저자 → 제목 → 주소 → 한 줄 요약 → 커버 사진 → 본문
    # 여기까지가 글쓰기고, 나머지(작성일·프로젝트·토글)는 「발행 설정」으로
    # 내려갑니다. 내리는 일은 admin-src/skin.js 가 하는데, 그게 죽어도
    # 이 차례 그대로 한 줄로 보이면 됩니다.
    fields:
      # 시안의 EDITOR 알약입니다. ⚠ widget 은 select 그대로 둡니다 —
      # skin.js 가 select 위젯을 갈아끼워서 **이름이 author 일 때만**
      # 알약으로 그립니다. 여기에 없는 위젯 이름을 적으면 skin.js 가
      # 안 떴을 때 폼이 통째로 깨집니다 (주소 칸과 같은 이유).
      - name: author
        label: 저자
        widget: select
        required: false
        options:
          - { label: study Lim — 배운 것, value: student }
          - { label: 임데브 — 만든 것, value: developer }

      - name: title
        label: 제목
        widget: string

      # ⚠ widget 은 string 그대로 둡니다. editor.js 가 string 위젯을
      #   갈아끼워서 **이 칸이 비어 있을 때만** 오늘 날짜·시각을 넣어
      #   줍니다 (2026-08-25-0930). 여기에 없는 위젯 이름을 적으면
      #   editor.js 가 안 떴을 때 폼이 통째로 깨집니다.
      - name: slug
        label: 주소
        widget: string
        pattern:
          ["^[a-z0-9]+(-[a-z0-9]+)*$", "영문 소문자·숫자·하이픈만 씁니다"]
        hint: "비워두면 날짜로 채워집니다. 고쳐도 됩니다 — 예: status-effects-redefined"

      # ⚠ string 이 아니라 text 입니다. 한 줄짜리 칸에 넣으면 문장이
      #   오른쪽으로 잘려서, 써 놓은 것을 보려면 커서를 끝까지 밀어야
      #   했습니다. 저장되는 값은 똑같은 한 줄 문자열입니다.
      - name: description
        label: 한 줄 요약
        widget: text
        required: false
        hint: 목록에서 제목 아래 보이는 문장입니다. 비워도 됩니다.

      # 시안의 「썸네일」입니다. 이름은 사이트가 쓰는 말(커버 사진)로 뒀습니다 (§4).
      #
      # ⚠ 저장되는 값은 `/images/<주소>/파일명` — **공개 경로 문자열**입니다.
      #   Astro 자산(`image()`)이 아닙니다. 자산으로 두면 이 경로를 못 읽고
      #   빌드가 멈춥니다 (src/content.config.ts 에 적어 뒀습니다).
      # ⚠ choose_url: false — 바깥 주소를 커버로 쓰지 않습니다. 티스토리 CDN
      #   주소가 만료돼서 404 가 된 적이 있습니다 (§5-2).
      - name: heroImage
        label: 커버 사진
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 5242880
        hint: "목록과 글 맨 위에 쓰입니다. 3:2 가 가장 잘 맞습니다. 비우면 본문 첫 사진을 씁니다."

      - name: body
        label: 본문
        widget: markdown
        hint: 글자를 고른 뒤 위 버튼을 누르면 그 자리에 들어갑니다.
        # 이 위젯은 admin/editor.js 가 갈아끼웁니다 — 마크다운 원문 +
        # 직접 만든 툴바(제목·굵게·색·사진). 왜 그렇게 했는지는 editor.js
        # 맨 위에 적어 뒀습니다.
        #
        # 아래 modes 는 editor.js 가 죽었을 때의 fallback 입니다.
        # ⚠ 리치 텍스트는 폰에서 한글 입력이 끊기고 코드펜스(```)를 망칩니다.
        #   modes 의 순서로는 기본 모드를 못 정합니다 — 두 개를 다 적으면
        #   무조건 리치 텍스트로 열립니다. raw 하나만 남겨야 원문으로 열립니다.
        modes: ["raw"]

      - name: pubDate
        label: 작성일
        widget: datetime
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false

      - name: project
        label: 프로젝트
        widget: select
        required: false
        options:
          - { label: GridBrawl, value: gridbrawl }
          - { label: MineApp, value: mineapp }
          - { label: BeepTimer, value: beeptimer }

      # ⚠ required: false 가 꼭 있어야 합니다. Decap 의 boolean 은 값이 없으면
      #   (= frontmatter 에 키가 아예 없으면) "필수인데 안 채웠다"로 봅니다.
      #   손으로 쓴 글에는 secret 키가 없어서, 열어서 고치려고 하면 저장이
      #   막히고 토글을 켰다 꺼야만 풀렸습니다. 없으면 false 입니다.
      - name: draft
        label: 초안으로 두기
        widget: boolean
        required: false
        default: false
        hint: 켜두면 사이트에 안 나옵니다.

      - name: secret
        label: 비밀글로 두기
        widget: boolean
        required: false
        default: false
        hint: 본문이 잠깁니다. 제목·요약·저자는 목록에 그대로 보입니다.
