backend:
  name: github
  repo: limjeahyuk/lim-it-blog
  branch: main
  # /api/auth 는 이 저장소의 Vercel 서버리스 함수입니다 (api/auth.js, api/callback.js)
  base_url: https://lim-it.vercel.app
  auth_endpoint: api/auth

# 로컬에서 `npm run cms` 를 띄우면 GitHub 없이 테스트할 수 있습니다.
local_backend: true

publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

locale: ko

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    editor:
      preview: false
    summary: '{{title}}'
    sortable_fields: ['pubDate', 'title']
    view_groups:
      - label: 프로젝트별
        field: project

    # 이 순서가 폰에서 보이는 순서입니다.
    # 반드시 채워야 하는 둘을 먼저, 그다음 본문, 나머지는 뒤로 뺐습니다.
    # 열자마자 제목 → 본문까지 바로 닿습니다.
    fields:
      - name: title
        label: 제목
        widget: string

      - name: description
        label: 한 줄 요약
        widget: string
        hint: 목록에서 제목 아래에 보이는 문장입니다.

      - name: body
        label: 본문
        widget: markdown

      - name: project
        label: 프로젝트
        widget: select
        required: false
        hint: 게임 devlog 가 아니면 비워두세요.
        options:
          - { label: GridBrawl, value: gridbrawl }
          - { label: BeepTimer, value: beeptimer }
          - { label: MineApp, value: mineapp }
          - { label: CoupleApp, value: coupleapp }
          - { label: MiniGame Speeder, value: speeder }
          - { label: TossTreasureHunt, value: tosstreasure }

      - name: tags
        label: 태그
        widget: list
        required: false
        default: []
        hint: 슬래시(/)는 쓰지 마세요. 주소가 깨집니다.

      - name: pubDate
        label: 작성일
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: false

      - name: author
        label: 글쓴이
        widget: select
        default: me
        options:
          - { label: 직접 씀, value: me }
          - { label: AI 초안, value: ai }
          - { label: AI 초안 + 직접 손봄, value: both }

      - name: draft
        label: 초안으로 두기
        widget: boolean
        default: false
        hint: 켜두면 사이트에 안 나옵니다. 나중에 끄면 공개됩니다.
