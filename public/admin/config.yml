backend:
  name: github
  repo: limjeahyuk/lim-it-blog
  branch: main
  # /api/auth 는 이 저장소의 Vercel 서버리스 함수입니다 (api/auth.js, api/callback.js)
  base_url: https://lim-it.vercel.app
  auth_endpoint: api/auth

# 로컬에서 `npm run cms` 를 띄우면 GitHub 없이 테스트할 수 있습니다.
local_backend: true

publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

locale: ko

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: src/content/posts
    create: true
    # 파일명 = URL 입니다. 제목을 그대로 쓰면 한글 주소가 나오므로
    # 영문 slug 를 직접 받습니다 (아래 slug 필드).
    slug: '{{fields.slug}}'
    extension: md
    format: frontmatter
    editor:
      preview: false
    # 글이 117개라 제목만으로는 어느 글인지 모릅니다. 날짜를 같이 보여줍니다.
    summary: "{{pubDate | date('YYYY-MM-DD')}}  {{title}}"
    # Decap 3.9 는 배열만 받습니다 (기본 정렬 지정은 안 됩니다 — 넣으면 설정이 통째로 깨집니다).
    sortable_fields: ['pubDate', 'title']

    # 사진은 글마다 제 폴더로 들어갑니다 — public/images/<주소>/.
    # 티스토리에서 옮겨온 404장이 쓰고 있는 규칙과 같은 자리입니다.
    # 앞의 / 는 "저장소 뿌리 기준"이라는 뜻입니다. 빼면 이 컬렉션 폴더
    # (src/content/posts) 밑으로 들어갑니다.
    media_folder: '/public/images/{{fields.slug}}'
    public_folder: '/images/{{fields.slug}}'

    # 이 순서가 폰에서 보이는 순서입니다.
    # 제목 → 주소 → 본문. 여기까지가 글쓰기고, 나머지 분류는 전부 뒤로 뺐습니다.
    fields:
      - name: title
        label: 제목
        widget: string

      - name: slug
        label: 주소
        widget: string
        pattern:
          ['^[a-z0-9]+(-[a-z0-9]+)*$', '영문 소문자·숫자·하이픈만 씁니다']
        hint: 'lim-it.vercel.app/posts/여기 — 예: status-effects-redefined'

      - name: body
        label: 본문
        widget: markdown
        hint: 글자를 고른 뒤 위 버튼을 누르면 그 자리에 들어갑니다.
        # 이 위젯은 admin/editor.js 가 갈아끼웁니다 — 마크다운 원문 +
        # 직접 만든 툴바(제목·굵게·색·사진). 왜 그렇게 했는지는 editor.js
        # 맨 위에 적어 뒀습니다.
        #
        # 아래 modes 는 editor.js 가 죽었을 때의 fallback 입니다.
        # ⚠ 리치 텍스트는 폰에서 한글 입력이 끊기고 코드펜스(```)를 망칩니다.
        #   modes 의 순서로는 기본 모드를 못 정합니다 — 두 개를 다 적으면
        #   무조건 리치 텍스트로 열립니다. raw 하나만 남겨야 원문으로 열립니다.
        modes: ['raw']

      - name: pubDate
        label: 작성일
        widget: datetime
        default: '{{now}}'
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: false

      - name: description
        label: 한 줄 요약
        widget: string
        required: false
        hint: 목록에서 제목 아래 보이는 문장입니다. 비워도 됩니다.

      - name: category
        label: 카테고리
        widget: select
        required: false
        options:
          - { label: 게임 개발, value: game }
          - { label: iOS, value: ios }
          - { label: 'iOS / SwiftUI', value: ios/swiftui }
          - { label: 'iOS / Storyboard', value: ios/storyboard }
          - { label: 'iOS / SDK', value: ios/sdk }
          - { label: 'iOS / BeepTimer', value: ios/beeptimer }
          - { label: 'iOS / 학습 일지', value: ios/study-diary }
          - { label: 공부, value: study }
          - { label: '공부 / React', value: study/react }
          - { label: '공부 / React 수업', value: study/react-school }
          - { label: '공부 / React 간단 정리', value: study/react-notes }
          - { label: '공부 / JavaScript', value: study/javascript }
          - { label: '공부 / Flutter', value: study/flutter }
          - { label: '공부 / Android 수업', value: study/android-school }
          - { label: 일기, value: diary }

      - name: project
        label: 프로젝트
        widget: select
        required: false
        options:
          - { label: GridBrawl, value: gridbrawl }
          - { label: MineApp, value: mineapp }
          - { label: BeepTimer, value: beeptimer }

      - name: tags
        label: 태그
        widget: list
        required: false
        default: []
        hint: 쉼표로 나눕니다. 슬래시(/)는 주소가 깨지니 쓰지 마세요.

      - name: draft
        label: 초안으로 두기
        widget: boolean
        default: false
        hint: 켜두면 사이트에 안 나옵니다.

      - name: secret
        label: 비밀글로 두기
        widget: boolean
        default: false
        hint: 본문이 잠깁니다. 제목·요약·태그는 목록에 그대로 보입니다.
